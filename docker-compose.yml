services:
  payram:
    # Built from this repo: the pinned vendor release plus our SSO landing page.
    # Keeping the service name `payram` preserves Coolify's domain mapping.
    build:
      context: .
    restart: unless-stopped
    environment:
      AES_KEY: ${AES_KEY}
      BLOCKCHAIN_NETWORK_TYPE: ${BLOCKCHAIN_NETWORK_TYPE}
      SERVER: ${SERVER}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SSL_CERT_PATH: ${SSL_CERT_PATH}
      PAYMENTS_APP_SERVER_URL: ${PAYMENTS_APP_SERVER_URL}
    volumes:
      - payram-data:/root/payram
      - payram-postgres:/var/lib/payram/db/postgres
    networks:
      - payram-network

volumes:
  payram-data:
  payram-postgres:

networks:
  payram-network:
    driver: bridge
